<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- css link -->
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>

<body>
    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Business Landing Page</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <header>
            <h1>Frontend AZ</h1>
            <nav>
                <a href="#services">Services</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
        </header>

        <section class="hero">
            <h2>We Build Modern Websites</h2>
            <p>Fast, Responsive and Professional</p>
            <button id="contactBtn">Contact Us</button>
        </section>

        <section id="services" class="services">
            <div class="card">Web Design</div>
            <div class="card">Frontend Dev</div>
            <div class="card">Landing Pages</div>
        </section>

        <section id="about">
            <h2>About Us</h2>
            <p>We create modern websites for businesses.</p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <input type="text" placeholder="Your name">
            <input type="email" placeholder="Email">
            <button>Send</button>
        </section>

        <footer>
            <p>© 2026 Frontend AZ</p>
        </footer>

        <script src="script.js"></script>
    </body>

    </html>



    <script src="./script.js"></script>
</body>

</html>
